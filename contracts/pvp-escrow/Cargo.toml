[package]
name = "pvp-escrow"
# 0.1.1: additive event schema change — `Staked` gained `stake_amount` and
# `Refunded` gained `player_a_amount` / `player_b_amount`. Storage and entry
# points are unchanged, so this is not a breaking upgrade for callers; only
# indexers gain fields. See CHANGELOG.md.
version = "0.1.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
