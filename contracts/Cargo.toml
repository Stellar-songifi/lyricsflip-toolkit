[workspace]
resolver = "2"
members = ["pvp-escrow", "test-fixtures/sep45-web-auth", "test-fixtures/test-smart-wallet"]

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
