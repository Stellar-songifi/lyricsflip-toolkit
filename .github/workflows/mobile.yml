name: mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/sdk/**"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/sdk/**"
      - "package-lock.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      run_maestro:
        description: "Run the Maestro Cloud end-to-end flows"
        type: boolean
        default: false
      app_artifact:
        description: "Path to a built .apk/.ipa in the workspace (plugin output or downloaded artifact)"
        type: string
        default: "apps/mobile/.maestro/app.apk"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Build the SDK the app depends on
        run: npm run build -w @lyricsflip-toolkit/sdk

      # NOTE: `npm run lint -w @lyricsflip-toolkit/mobile` is actually `tsc --noEmit`,
      # not ESLint. ESLint is not yet configured for the mobile workspace, so there is
      # no separate ESLint step here. Once an ESLint config is added for apps/mobile,
      # add a dedicated "Lint (ESLint)" step running ESLint for that workspace.
      - name: Typecheck (tsc --noEmit)
        run: npm run lint -w @lyricsflip-toolkit/mobile

      - name: Tests
        run: npm test -w @lyricsflip-toolkit/mobile

      - name: Bundle for Android (Metro + Hermes)
        working-directory: apps/mobile
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir .expo-export
        run: npx expo export --platform android --output-dir .expo-export

      # E2E needs an installable binary and a running game server in mock mode,
      # so it is opt-in rather than blocking every pull request.
      - name: Run Maestro Cloud flows
        if: github.event_name == 'workflow_dispatch' && inputs.run_maestro
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          MAESTRO_CLOUD_PROJECT_ID: ${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}
          APP_ARTIFACT: ${{ inputs.app_artifact }}
        run: |
          test -n "$MAESTRO_CLOUD_API_KEY"
          test -f "$APP_ARTIFACT"
          npx --yes maestro cloud --api-key "$MAESTRO_CLOUD_API_KEY" \
            --project-id "$MAESTRO_CLOUD_PROJECT_ID" \
            "$APP_ARTIFACT" apps/mobile/.maestro
