name: integration

# Real settlement against a throwaway local Stellar network. Never testnet or
# mainnet: the network is started inside the job and discarded with it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/**"
      - "packages/server/**"
      - "packages/sdk/**"
      # apps/game-server and examples/coin-flip consume the SDK, so a change
      # there can break settlement without touching any package. game-server is
      # the likeliest source of a regression that only this workflow catches.
      - "apps/game-server/**"
      - "examples/**"
      # The job installs from the lockfile and builds the SDK, so dependency
      # changes can break it too. Kept in step with node.yml and mobile.yml.
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration.yml"

# One run per branch: a push that supersedes an in-flight run cancels it rather
# than queueing behind it, which is what you want for a ~15 minute job that
# starts a Docker network. `github.ref` is the PR's merge ref, so this only
# ever cancels runs for the same branch or PR.
concurrency:
  group: "integration-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  stellar-local:
    runs-on: ubuntu-latest
    # A cold run is dominated by the Rust side: this workflow has no cargo
    # cache, so the wasm32v1-none target and the whole soroban-sdk graph are
    # compiled from scratch (minutes on their own). Then the quickstart image
    # pull, `npm ci`, the wait-for-network loop below (up to 5 minutes before
    # it gives up), and the integration suite. Cold runs land around 10-15
    # minutes, so 30 leaves headroom for a slow runner or a flaky image pull
    # without letting a wedged job sit for the 6-hour default.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PVP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip_test
    steps:
      - uses: actions/checkout@v4

      - name: Start a local Stellar network
        run: docker run -d --name stellar -p 8000:8000 stellar/quickstart:latest --local --enable core,rpc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Build pvp-escrow
        working-directory: contracts
        run: cargo build --target wasm32v1-none --release

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Wait for the network
        run: |
          for i in $(seq 1 60); do
            curl -s -X POST localhost:8000/rpc -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q healthy && exit 0
            sleep 5
          done
          docker logs stellar | tail -50
          exit 1

      - name: Integration tests
        run: npm run test:integration -w @lyricsflip-toolkit/server
