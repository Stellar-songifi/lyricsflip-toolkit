name: node

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
