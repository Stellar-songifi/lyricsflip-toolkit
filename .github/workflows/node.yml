name: node

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint game-server (ESLint, no --fix)
        working-directory: apps/game-server
        run: npx eslint "{src,test}/**/*.ts"

      - name: Lint sdk
        run: npm run lint -w @lyricsflip-toolkit/sdk

      - name: Lint server
        run: npm run lint -w @lyricsflip-toolkit/server

      - name: Lint mobile
        run: npm run lint -w @lyricsflip-toolkit/mobile

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate mobile OpenAPI types
        run: npm run generate:api-types -w @lyricsflip-toolkit/mobile

      - name: Fail if generated types are out of date
        run: |
          if ! git diff --exit-code -- apps/mobile/src/lib/api-types.ts; then
            echo "::error::Generated OpenAPI types are out of date. Run 'npm run generate:api-types -w @lyricsflip-toolkit/mobile' and commit the result."
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PVP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip_e2e
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Coverage (game-server)
        run: npm run test:cov -w @lyricsflip-toolkit/game-server

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/game-server/coverage/lcov.info
          flags: game-server
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: End-to-end tests
        run: npm run test:e2e
        run: npm run test:e2e

  migration-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip_migrations
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run all migrations against a fresh database
        working-directory: apps/game-server
        run: npm run migration:run

      - name: Check for migration drift
        working-directory: apps/game-server
        run: |
          set -o pipefail
          OUTPUT="$(npx typeorm schema:log --dataSource src/config/data-source.ts 2>&1)" || {
            echo "$OUTPUT"
            echo "::error::Failed to compute schema diff against entities."
            exit 1
          }
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -qi "schema is up to date"; then
            echo "::error::Migration drift detected: committed migrations do not match the entities. Generate and commit the missing migration(s)."
            exit 1
          fi
