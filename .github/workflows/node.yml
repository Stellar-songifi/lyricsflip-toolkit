name: node

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/node.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PVP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip_test
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip_e2e
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
