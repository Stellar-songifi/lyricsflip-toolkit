name: release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: "EAS build profile"
        type: choice
        options: [preview, production]
        default: preview
      submit:
        description: "Submit after a successful build (needs store credentials)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Build the SDK the app depends on
        run: npm run build -w @lyricsflip-toolkit/sdk

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: eas build --non-interactive --profile ${{ inputs.profile }} --platform ${{ inputs.platform }}

      - name: Submit to the stores
        if: inputs.submit
        working-directory: apps/mobile
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: eas submit --non-interactive --profile production --platform ${{ inputs.platform }}
